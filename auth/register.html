<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Pocket World</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="back-button" onclick="window.location.href='../index.html'">
        <svg viewBox="0 0 24 24">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
    </div>

    <div class="container">
        <div class="form-box">
            <h2>Создать аккаунт</h2>
            <p class="subtitle">Присоединяйтесь к Pocket World</p>
            
            <form action="register_action.php" method="POST">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Имя пользователя" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="Пароль" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password_confirm" placeholder="Повторите пароль" required>
                </div>
                <div class="options">
                    <label>
                        <input type="checkbox" required> Я принимаю условия
                    </label>
                </div>

                <button type="submit" class="btn">Зарегистрироваться</button>
            </form>

            <div class="footer-text">
                Уже есть аккаунт? <a href="index.html">Войти</a>
            </div>
        </div>
    </div>
</body>
</html>
