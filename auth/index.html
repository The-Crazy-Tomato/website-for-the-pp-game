<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Pocket World</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="back-button" onclick="window.location.href='../index.html'">
        <svg viewBox="0 0 24 24">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
    </div>

    <div class="container">
        <div class="form-box">
            <h2>Добро пожаловать!</h2>
            <p class="subtitle">Войдите в свой аккаунт</p>
            
            <form id="loginForm" method="POST">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Пароль" required>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox"> Запомнить меня
                    </label>
                    <a href="#">Забыли пароль?</a>
                </div>

                <button type="submit" class="btn">Войти</button>
            </form>

            <div class="footer-text">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </div>
            <div id="error-message" class="error-message" style="display: none;"></div>
        </div>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-message');
        
        // Показываем сообщение о загрузке
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Вход...';
        errorDiv.style.color = '#AEC3B0';
        errorDiv.style.borderColor = '#AEC3B0';
        
        try {
            const formData = new FormData();
            formData.append('email', email);
            formData.append('password', password);
            
            const response = await fetch('login_action.php', {
                method: 'POST',
                body: formData
            });
            
            // Проверяем, что ответ - это JSON
            const contentType = response.headers.get('content-type');
            if (!contentType || !contentType.includes('application/json')) {
                const text = await response.text();
                console.error('Ответ не JSON:', text);
                errorDiv.style.color = '#ff6b6b';
                errorDiv.style.borderColor = '#ff6b6b';
                errorDiv.textContent = 'Ошибка сервера';
                return;
            }
            
            const data = await response.json();
            
            if (data.success) {
                // ✅ Сохраняем в localStorage
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', data.user.username);
                localStorage.setItem('userEmail', data.user.email);
                localStorage.setItem('userId', data.user.id);
                
                // Редирект на главную
                window.location.href = '../index.html';
            } else {
                errorDiv.style.color = '#ff6b6b';
                errorDiv.style.borderColor = '#ff6b6b';
                errorDiv.textContent = data.message || 'Ошибка входа';
            }
        } catch (error) {
            console.error('Ошибка:', error);
            errorDiv.style.color = '#ff6b6b';
            errorDiv.style.borderColor = '#ff6b6b';
            errorDiv.textContent = 'Ошибка соединения с сервером';
        }
    });
    </script>
</body>
</html>
